<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>TechMart – Browse Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: bold; }
    .product-card { height: 100%; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3">
  <span class="navbar-brand">TechMart</span>
  <div class="ms-auto d-flex gap-2">
    <span class="text-white me-2 align-self-center" id="welcomeMsg"></span>
    <a class="btn btn-light btn-sm" href="cart.html">🛒 Cart</a>
    <a class="btn btn-outline-light btn-sm" href="order-status.html">My Orders</a>
    <a class="btn btn-outline-light btn-sm" href="request-item.html">Request Item</a>
    <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container mt-4">
  <h4>Browse Products</h4>

  <!-- Search + Filter row (User Portal dropdown from Excel) -->
  <div class="row mb-3">
    <div class="col-md-5">
      <input type="text" class="form-control" id="searchInput" placeholder="Search products by name..."/>
    </div>
    <div class="col-md-4">
      <select class="form-select" id="categoryFilter" onchange="filterByCategory()">
        <option value="">-- All Categories --</option>
        <option value="Electronics">Electronics</option>
        <option value="Clothing">Clothing</option>
        <option value="Books">Books</option>
        <option value="Food">Food</option>
        <option value="Sports">Sports</option>
        <option value="Home">Home</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="col-md-3">
      <button class="btn btn-primary w-100" onclick="searchProducts()">Search</button>
    </div>
  </div>

  <div id="alertMsg" class="d-none alert"></div>

  <!-- Products grid -->
  <div class="row g-3" id="productGrid">
    <div class="col-12 text-center text-muted">Loading products...</div>
  </div>
</div>

<script>
  const API = 'http://localhost:8080/api';

  // Auth guard
  const user = JSON.parse(localStorage.getItem('user') || 'null');
  if (!user || user.role !== 'USER') window.location.href = 'login.html';
  document.getElementById('welcomeMsg').textContent = 'Hi, ' + user.name;

  // Load all products on page load
  window.onload = loadProducts;

  async function loadProducts() {
    const res  = await fetch(`${API}/products`);
    const data = await res.json();
    renderProducts(data);
  }

  async function searchProducts() {
    const name = document.getElementById('searchInput').value.trim();
    if (!name) { loadProducts(); return; }
    const res  = await fetch(`${API}/products/search?name=${encodeURIComponent(name)}`);
    const data = await res.json();
    renderProducts(data);
  }

  async function filterByCategory() {
    const cat = document.getElementById('categoryFilter').value;
    if (!cat) { loadProducts(); return; }
    const res  = await fetch(`${API}/products/category?cat=${encodeURIComponent(cat)}`);
    const data = await res.json();
    renderProducts(data);
  }

  function renderProducts(products) {
    const grid = document.getElementById('productGrid');
    if (!products || products.length === 0) {
      grid.innerHTML = '<div class="col-12 text-center text-muted">No products found.</div>';
      return;
    }
    grid.innerHTML = products.map(p => `
      <div class="col-md-4">
        <div class="card product-card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">${p.name}</h5>
            <p class="card-text text-muted small">${p.description || 'No description'}</p>
            <p class="mb-1"><strong>Price:</strong> ₹${p.price}</p>
            <p class="mb-1"><strong>Stock:</strong> ${p.stock}</p>
            <p class="mb-2"><small class="text-secondary">By: ${p.vendorName} | ${p.category || 'General'}</small></p>
            ${p.stock > 0
              ? `<div class="d-flex gap-2 align-items-center">
                   <input type="number" id="qty_${p.id}" value="1" min="1" max="${p.stock}" class="form-control form-control-sm" style="width:70px"/>
                   <button class="btn btn-primary btn-sm" onclick="addToCart(${p.id})">Add to Cart</button>
                 </div>`
              : `<span class="badge bg-danger">Out of Stock</span>`
            }
          </div>
        </div>
      </div>
    `).join('');
  }

  async function addToCart(productId) {
    const qty = parseInt(document.getElementById(`qty_${productId}`).value) || 1;
    try {
      const res  = await fetch(`${API}/cart/add`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: user.id, productId, quantity: qty })
      });
      const data = await res.json();
      showAlert(data.message, data.success);
    } catch(e) { showAlert('Error adding to cart.', false); }
  }

  function showAlert(msg, ok) {
    const el = document.getElementById('alertMsg');
    el.textContent = msg;
    el.className = `alert ${ok ? 'alert-success' : 'alert-danger'}`;
    setTimeout(() => el.classList.add('d-none'), 3000);
  }

  function logout() {
    localStorage.removeItem('user');
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
