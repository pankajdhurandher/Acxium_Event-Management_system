<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>TechMart – Order Placed!</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style> body { background: #f0f2f5; } .success-card { max-width:500px; margin:100px auto; } </style>
</head>
<body>
<div class="success-card">
  <div class="card shadow text-center p-5">
    <div style="font-size:4rem;">✅</div>
    <h3 class="mt-3 text-success">Order Placed Successfully!</h3>
    <p class="text-muted">Your order has been received and is being processed.</p>
    <p><strong>Order ID:</strong> #<span id="orderId"></span></p>
    <hr/>
    <div class="d-flex gap-2 justify-content-center">
      <a href="order-status.html" class="btn btn-primary">Track My Orders</a>
      <a href="products.html" class="btn btn-outline-secondary">Continue Shopping</a>
    </div>
  </div>
</div>
<script>
  const orderId = localStorage.getItem('lastOrderId') || '—';
  document.getElementById('orderId').textContent = orderId;
</script>
</body>
</html>
