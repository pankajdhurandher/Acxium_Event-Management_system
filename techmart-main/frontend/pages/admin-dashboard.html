<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>TechMart – Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand fw-bold">TechMart – Admin Panel</span>
  <div class="ms-auto d-flex gap-2">
    <span class="text-white align-self-center" id="adminName"></span>
    <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container mt-4">

  <!-- ── STATS ROW (Admin sheet) ─────────────────────────────────────────── -->
  <div class="row g-3 mb-4" id="statsRow">
    <div class="col-md-3">
      <div class="card text-white bg-primary text-center p-3">
        <h6>Total Users</h6>
        <h2 id="statUsers">—</h2>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-warning text-center p-3">
        <h6 class="text-dark">Total Vendors</h6>
        <h2 id="statVendors" class="text-dark">—</h2>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-success text-center p-3">
        <h6>Total Products</h6>
        <h2 id="statProducts">—</h2>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-secondary text-center p-3">
        <h6>Total Orders</h6>
        <h2 id="statOrders">—</h2>
      </div>
    </div>
  </div>

  <!-- Tab navigation -->
  <ul class="nav nav-tabs" id="adminTabs">
    <li class="nav-item">
      <button class="nav-link active" onclick="showTab('users')">Manage Users</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" onclick="showTab('vendors')">Manage Vendors</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" onclick="showTab('orders')">All Orders</button>
    </li>
  </ul>

  <div class="mt-3">

    <!-- ── TAB 1: MANAGE USERS (Maintain User sheet) ──────────────────────── -->
    <div id="tab-users">
      <h5>All Users</h5>
      <div id="userAlert" class="d-none alert"></div>
      <table class="table table-bordered table-hover">
        <thead class="table-light">
          <tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Action</th></tr>
        </thead>
        <tbody id="userTableBody">
          <tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- ── TAB 2: MANAGE VENDORS (Maintain Vendor sheet) ─────────────────── -->
    <div id="tab-vendors" class="d-none">
      <h5>All Vendors</h5>
      <div id="vendorAlert" class="d-none alert"></div>
      <table class="table table-bordered table-hover">
        <thead class="table-light">
          <tr><th>ID</th><th>Business Name</th><th>Email</th><th>Phone</th><th>Joined</th><th>Action</th></tr>
        </thead>
        <tbody id="vendorTableBody">
          <tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- ── TAB 3: ALL ORDERS (Admin monitoring) ──────────────────────────── -->
    <div id="tab-orders" class="d-none">
      <h5>All Orders</h5>
      <table class="table table-bordered table-hover">
        <thead class="table-light">
          <tr><th>Order ID</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th></tr>
        </thead>
        <tbody id="adminOrderBody">
          <tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<script>
  const API  = 'http://localhost:8080/api';
  const user = JSON.parse(localStorage.getItem('user') || 'null');
  if (!user || user.role !== 'ADMIN') window.location.href = 'login.html';
  document.getElementById('adminName').textContent = 'Admin: ' + user.name;

  window.onload = () => { loadStats(); loadUsers(); };

  // ── STATS ──────────────────────────────────────────────────────────────────
  async function loadStats() {
    const res  = await fetch(`${API}/admin/stats`);
    const data = await res.json();
    document.getElementById('statUsers').textContent    = data.totalUsers    ?? 0;
    document.getElementById('statVendors').textContent  = data.totalVendors  ?? 0;
    document.getElementById('statProducts').textContent = data.totalProducts ?? 0;
    document.getElementById('statOrders').textContent   = data.totalOrders   ?? 0;
  }

  // ── TAB SWITCHING ──────────────────────────────────────────────────────────
  function showTab(name) {
    ['users','vendors','orders'].forEach(t => {
      document.getElementById('tab-' + t).classList.add('d-none');
    });
    document.getElementById('tab-' + name).classList.remove('d-none');

    document.querySelectorAll('#adminTabs .nav-link').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');

    if (name === 'users')   loadUsers();
    if (name === 'vendors') loadVendors();
    if (name === 'orders')  loadOrders();
  }

  // ── USERS (Maintain User sheet) ────────────────────────────────────────────
  async function loadUsers() {
    const res  = await fetch(`${API}/admin/users`);
    const list = await res.json();
    const tbody = document.getElementById('userTableBody');

    if (!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No users found.</td></tr>';
      return;
    }

    tbody.innerHTML = list.map(u => `
      <tr>
        <td>${u.id}</td>
        <td>${u.name}</td>
        <td>${u.email}</td>
        <td><span class="badge bg-primary">${u.role}</span></td>
        <td>${u.createdAt ? u.createdAt.substring(0,10) : '—'}</td>
        <td>
          <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">Delete</button>
        </td>
      </tr>
    `).join('');
  }

  async function deleteUser(id) {
    if (!confirm('Delete this user? This cannot be undone.')) return;
    const res  = await fetch(`${API}/admin/users/${id}`, { method: 'DELETE' });
    const data = await res.json();
    showAlert('userAlert', data.message, data.success);
    if (data.success) { loadUsers(); loadStats(); }
  }

  // ── VENDORS (Maintain Vendor sheet) ───────────────────────────────────────
  async function loadVendors() {
    const res  = await fetch(`${API}/admin/vendors`);
    const list = await res.json();
    const tbody = document.getElementById('vendorTableBody');

    if (!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No vendors found.</td></tr>';
      return;
    }

    tbody.innerHTML = list.map(v => `
      <tr>
        <td>${v.id}</td>
        <td>${v.businessName}</td>
        <td>${v.email}</td>
        <td>${v.phone || '—'}</td>
        <td>${v.createdAt ? v.createdAt.substring(0,10) : '—'}</td>
        <td>
          <button class="btn btn-sm btn-danger" onclick="deleteVendor(${v.id})">Delete</button>
        </td>
      </tr>
    `).join('');
  }

  async function deleteVendor(id) {
    if (!confirm('Delete this vendor and all their products?')) return;
    const res  = await fetch(`${API}/admin/vendors/${id}`, { method: 'DELETE' });
    const data = await res.json();
    showAlert('vendorAlert', data.message, data.success);
    if (data.success) { loadVendors(); loadStats(); }
  }

  // ── ALL ORDERS ─────────────────────────────────────────────────────────────
  async function loadOrders() {
    const res  = await fetch(`${API}/orders/all`);
    const list = await res.json();
    const tbody = document.getElementById('adminOrderBody');

    if (!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No orders yet.</td></tr>';
      return;
    }

    const badge = { PENDING:'warning', PROCESSING:'info', SHIPPED:'primary', DELIVERED:'success', CANCELLED:'danger' };
    tbody.innerHTML = list.map(o => `
      <tr>
        <td>#${o.orderId}</td>
        <td>${o.userName}</td>
        <td>₹${o.totalAmount}</td>
        <td>${o.paymentMethod}</td>
        <td><span class="badge bg-${badge[o.status] || 'secondary'}">${o.status}</span></td>
        <td>${o.createdAt ? o.createdAt.substring(0,10) : '—'}</td>
      </tr>
    `).join('');
  }

  // ── HELPERS ────────────────────────────────────────────────────────────────
  function showAlert(elId, msg, ok) {
    const el = document.getElementById(elId);
    el.textContent = msg;
    el.className = `alert ${ok ? 'alert-success' : 'alert-danger'}`;
    setTimeout(() => el.classList.add('d-none'), 3000);
  }

  function logout() {
    localStorage.removeItem('user');
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
