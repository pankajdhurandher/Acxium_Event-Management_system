<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>TechMart – My Orders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand">TechMart – My Orders</span>
  <div class="ms-auto d-flex gap-2">
    <a class="btn btn-outline-light btn-sm" href="products.html">← Shop</a>
    <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container mt-4">
  <h4>Order Status</h4>
  <p class="text-muted">Track the status of all your orders below.</p>
  <div id="ordersContainer">
    <p class="text-muted">Loading orders...</p>
  </div>
</div>

<script>
  const API  = 'http://localhost:8080/api';
  const user = JSON.parse(localStorage.getItem('user') || 'null');
  if (!user || user.role !== 'USER') window.location.href = 'login.html';

  window.onload = loadOrders;

  async function loadOrders() {
    const res    = await fetch(`${API}/orders/user/${user.id}`);
    const orders = await res.json();
    const cont   = document.getElementById('ordersContainer');

    if (!orders || orders.length === 0) {
      cont.innerHTML = '<p class="text-muted">No orders yet. <a href="products.html">Start shopping!</a></p>';
      return;
    }

    const statusBadge = {
      PENDING:    'warning',
      PROCESSING: 'info',
      SHIPPED:    'primary',
      DELIVERED:  'success',
      CANCELLED:  'danger'
    };

    cont.innerHTML = orders.map(o => `
      <div class="card mb-3 shadow-sm">
        <div class="card-header d-flex justify-content-between">
          <strong>Order #${o.orderId}</strong>
          <span class="badge bg-${statusBadge[o.status] || 'secondary'}">${o.status}</span>
        </div>
        <div class="card-body">
          <p class="mb-1"><strong>Total:</strong> ₹${o.totalAmount}
             &nbsp;|&nbsp; <strong>Payment:</strong> ${o.paymentMethod}
             &nbsp;|&nbsp; <strong>Placed:</strong> ${o.createdAt.substring(0,10)}</p>
          <p class="mb-2"><strong>Address:</strong> ${o.address}</p>
          <table class="table table-sm table-bordered mb-0">
            <thead class="table-light">
              <tr><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr>
            </thead>
            <tbody>
              ${o.items.map(i => `
                <tr>
                  <td>${i.productName}</td>
                  <td>${i.quantity}</td>
                  <td>₹${i.price}</td>
                  <td>₹${i.subtotal}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `).join('');
  }

  function logout() {
    localStorage.removeItem('user');
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
