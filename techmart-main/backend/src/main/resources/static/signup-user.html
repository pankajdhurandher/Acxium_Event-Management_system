<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>TechMart – User Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style> body{background:#f0f2f5;} .card{max-width:420px;margin:80px auto;} </style>
</head>
<body>
<div class="card shadow">
  <div class="card-header bg-success text-white text-center">
    <h4 class="mb-0">Create User Account</h4>
  </div>
  <div class="card-body p-4">
    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-control" id="name" placeholder="Your full name"/>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" id="email" placeholder="you@example.com"/>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="password" placeholder="Min 6 characters"/>
    </div>
    <div id="msg" class="d-none alert"></div>
    <button class="btn btn-success w-100" onclick="signup()">Sign Up</button>
    <div class="text-center mt-3">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>
</div>
<script>
  async function signup() {
    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msgEl    = document.getElementById('msg');

    if (!name || !email || !password) { showMsg('All fields required.', false); return; }

    try {
      const res  = await fetch('http://localhost:8080/api/auth/user/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();
      showMsg(data.message, data.success);
      if (data.success) setTimeout(() => window.location.href = 'login.html', 1500);
    } catch(e) { showMsg('Server not reachable.', false); }
  }

  function showMsg(msg, ok) {
    const el = document.getElementById('msg');
    el.textContent = msg;
    el.className = `alert ${ok ? 'alert-success' : 'alert-danger'}`;
  }
</script>
</body>
</html>
